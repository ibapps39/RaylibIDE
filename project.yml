name: RaylibIDE
options:
  bundleIdPrefix: dev.raylibide
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO

targets:
  RaylibIDE:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Platform
        excludes: ["rcore_ios.c", "Bridging-Header.h"]     # rcore_ios.c is #included by rcore.c
      - path: Vendor/raylib/src
        includes: ["rcore.c", "rshapes.c", "rtextures.c", "rtext.c", "rmodels.c", "utils.c"]
        compilerFlags: ["-w"]
      - path: Vendor/tinycc
        includes: ["libtcc.c"]
        compilerFlags: ["-w", "-DONE_SOURCE=1"]
      - path: Resources/include
        type: folder                                        # copied as folder reference -> <bundle>/include
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raylibide.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Platform/Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - PLATFORM_IOS=1
          - GRAPHICS_API_OPENGL_ES3=1
          - "$(inherited)"
        # NOTE: do NOT add Vendor/raylib/src/external here - its dirent.h would shadow the system one.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Shims"
          - "$(SRCROOT)/Platform"
          - "$(SRCROOT)/Generated"
          - "$(SRCROOT)/Vendor/raylib/src"
          - "$(SRCROOT)/Vendor/tinycc"
        OTHER_LDFLAGS: ["-framework", "OpenGLES", "-framework", "QuartzCore",
                        "-framework", "AudioToolbox", "-framework", "AVFoundation",
                        "-framework", "CoreAudio", "-framework", "UIKit"]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: raylib IDE
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
