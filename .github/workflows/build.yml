name: Build unsigned IPA
on:
  workflow_dispatch:
    inputs:
      raylib_ref:
        description: raylib tag/branch to build into the app
        default: "5.5"
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch raylib + TinyCC and generate sources
        env:
          RAYLIB_REF: ${{ github.event.inputs.raylib_ref || '5.5' }}
        run: ./scripts/fetch_deps.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          xcodebuild -project RaylibIDE.xcodeproj -scheme RaylibIDE \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build | tee build.log | tail -n 60
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RaylibIDE.app Payload/
          zip -qry RaylibIDE.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RaylibIDE-ipa
          path: RaylibIDE.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
